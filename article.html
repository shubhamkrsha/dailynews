
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyNews - Article Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            Daily<span>News</span>
        </div>

        <a href="index.html">Back to Home</a>
    </header>


    <!-- Article Details -->
    <main class="article-page">

        <article class="article-details">

            <img
                src="images/news1.jpg"
                alt="News article image"
                id="articleImage"
            >

            <span id="articleCategory">INDIA</span>

            <h1 id="articleTitle">
                India News Headline One
            </h1>

            <p id="articleDate">
                17 November 2026
            </p>

            <div id="articleContent">
                <p>
                    Latest updates and developments from across India.
                </p>
            </div>

        </article>

    </main>


    <!-- Footer -->
    <footer class="footer article-footer">
        <h2>DailyNews</h2>
        <p>Bringing you the latest news from across India.</p>
        <p>© 2026 DailyNews. All rights reserved.</p>
    </footer>

    <script src="article.js"></script>
</body>
</html>
